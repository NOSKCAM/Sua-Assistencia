<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Assistência Pro</title>
    <style>
        :root { --primary: #1e3a8a; --secondary: #0284c7; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: var(--primary); margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background-color: var(--secondary); }
        .canvas-container { border: 1px solid #ccc; border-radius: 6px; background: #fff; margin-top: 5px; }
        canvas { width: 100%; height: 150px; touch-action: none; }
        .os-card { border-left: 4px solid var(--secondary); background: #f1f5f9; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Chaves de conexão recuperadas do seu projeto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDOzWAT4oWzJuqSO0Qi_ToCUgbWxIpxLZ4",
            authDomain: "sua-assistencia.firebaseapp.com",
            projectId: "sua-assistencia",
            storageBucket: "sua-assistencia.firebasestorage.app",
            messagingSenderId: "780070354483",
            appId: "1:780070354483:web:b761d6faef14120bed0d46"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.db = db;
        window.storage = storage;
        window.fbUtils = { collection, addDoc, getDocs, query, where, deleteDoc, doc, ref, uploadBytes, getDownloadURL };
    </script>
</head>
<body>

<div class="container">
    <h1>Sua Assistência Pro</h1>
    
    <!-- Formulário de Nova OS -->
    <div id="osFormSection">
        <h2>Nova Ordem de Serviço</h2>
        <form id="osForm">
            <div class="form-group">
                <label>Nome do Cliente:</label>
                <input type="text" id="cliente" required>
            </div>
            <div class="form-group">
                <label>Aparelho / Equipamento:</label>
                <input type="text" id="equipamento" required>
            </div>
            <div class="form-group">
                <label>Defeito / Relato:</label>
                <textarea id="defeito" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Valor Estimado (R$):</label>
                <input type="number" id="valor" step="0.01">
            </div>
            <div class="form-group">
                <label>Foto do Equipamento:</label>
                <input type="file" id="fotoInput" accept="image/*">
            </div>
            <div class="form-group">
                <label>Assinatura do Cliente:</label>
                <div class="canvas-container">
                    <canvas id="signaturePad"></canvas>
                </div>
                <button type="button" onclick="limparAssinatura()" style="background:#64748b; margin-top:5px;">Limpar Assinatura</button>
            </div>
            <button type="submit" id="btnSalvar">Salvar Ordem de Serviço</button>
        </form>
    </div>

    <hr style="margin: 30px 0;">

    <!-- Listagem de OS -->
    <div>
        <h2>Ordens de Serviço Ativas</h2>
        <button onclick="carregarOS()" style="background:#0284c7; margin-bottom:15px;">Atualizar Lista</button>
        <div id="listaOS">Carregando ordens de serviço...</div>
    </div>
</div>

<div id="printArea" style="display:none; padding:20px;"></div>

<script>
    // Configuração do Canvas de Assinatura
    const canvas = document.getElementById('signaturePad');
    const ctx = canvas.getContext('2d');
    let desenhando = false;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 150;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 500);

    canvas.addEventListener('mousedown', () => desenhando = true);
    canvas.addEventListener('mouseup', () => { desenhando = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', desenhar);

    canvas.addEventListener('touchstart', (e) => { desenhando = true; e.preventDefault(); });
    canvas.addEventListener('touchend', () => { desenhando = false; ctx.beginPath(); });
    canvas.addEventListener('touchmove', (e) => {
        if(!desenhando) return;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
        e.preventDefault();
    });

    function desenhar(e) {
        if(!desenhando) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function limparAssinatura() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Lógica para Salvar no Firebase
    document.getElementById('osForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSalvar');
        btn.disabled = true;
        btn.innerText = "Salvando na Nuvem...";

        try {
            let fotoUrl = "";
            const fotoFile = document.getElementById('fotoInput').files[0];
            if(fotoFile) {
                const storageRef = window.fbUtils.ref(window.storage, 'fotos/' + Date.now() + '_' + fotoFile.name);
                await window.fbUtils.uploadBytes(storageRef, fotoFile);
                fotoUrl = await window.fbUtils.getDownloadURL(storageRef);
            }

            // Assinatura em Base64
            const assinaturaData = canvas.toDataURL();

            const novaOS = {
                cliente: document.getElementById('cliente').value,
                equipamento: document.getElementById('equipamento').value,
                defeito: document.getElementById('defeito').value,
                valor: document.getElementById('valor').value,
                fotoUrl: fotoUrl,
                assinatura: assinaturaData,
                status: 'Ativo',
                dataCriacao: new Date().toISOString()
            };

            await window.fbUtils.addDoc(window.fbUtils.collection(window.db, "ordens_servico"), novaOS);
            alert("Ordem de Serviço criada com sucesso!");
            document.getElementById('osForm').reset();
            limparAssinatura();
            carregarOS();
        } catch (error) {
            console.error("Erro ao salvar: ", error);
            alert("Erro ao salvar OS. Verifique se ativou o modo de teste no Firestore/Storage.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Salvar Ordem de Serviço";
        }
    });

    // Lógica para Carregar e Aplicar Filtro da Lixeira (30 Dias)
    async function carregarOS() {
        const container = document.getElementById('listaOS');
        container.innerHTML = "Buscando dados...";

        try {
            const querySnapshot = await window.fbUtils.getDocs(window.fbUtils.collection(window.db, "ordens_servico"));
            container.innerHTML = "";

            const agora = new Date();

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const dataCriacao = new Date(data.dataCriacao);
                const diasDiferenca = (agora - dataCriacao) / (1000 * 60 * 60 * 24);

                // Regra dos 30 dias: Se tiver mais de 30 dias e estiver concluído, oculta/remove
                if(data.status === 'Concluido' && diasDiferenca > 30) {
                    return; // Pula a exibição
                }

                const card = document.createElement('div');
                card.className = 'os-card';
                card.innerHTML = `
                    <h3>OS #${docSnap.id.substring(0,6)} - ${data.cliente}</h3>
                    <p><strong>Equipamento:</strong> ${data.equipamento}</p>
                    <p><strong>Defeito:</strong> ${data.defeito}</p>
                    <p><strong>Valor:</strong> R$ ${data.valor || '0.00'}</p>
                    <p><strong>Data:</strong> ${dataCriacao.toLocaleDateString('pt-BR')}</p>
                    ${data.fotoUrl ? `<p><a href="${data.fotoUrl}" target="_blank">Ver Foto Anexada</a></p>` : ''}
                    <button onclick="imprimirOS('${data.cliente}', '${data.equipamento}', '${data.defeito}', '${data.valor}', '${data.assinatura}')" style="background:#16a34a;">Imprimir / Gerar PDF</button>
                `;
                container.appendChild(card);
            });

            if(container.innerHTML === "") {
                container.innerHTML = "Nenhuma Ordem de Serviço ativa encontrada.";
            }
        } catch (error) {
            console.error("Erro ao carregar: ", error);
            container.innerHTML = "Erro ao carregar lista de OS.";
        }
    }

    function imprimirOS(cliente, eq, def, val, ass) {
        const printArea = document.getElementById('printArea');
        printArea.innerHTML = `
            <h2>Sua Assistência Pro - Comprovante</h2>
            <hr>
            <p><strong>Cliente:</strong> ${cliente}</p>
            <p><strong>Equipamento:</strong> ${eq}</p>
            <p><strong>Defeito Relatado:</strong> ${def}</p>
            <p><strong>Valor Orcado:</strong> R$ ${val}</p>
            <br>
            <p><strong>Assinatura do Cliente:</strong></p>
            <img src="${ass}" style="border-bottom:1px solid #000; max-width:300px;">
        `;
        window.print();
    }

    window.onload = () => setTimeout(carregarOS, 1500);
</script>
</body>
</html>
